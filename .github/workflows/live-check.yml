# Every 6 hours: test the LIVE site (pages, booking links, SEO files, security headers, health).
# This catches "the site is up but broken" (a missing button, a bad deploy, an expired setting).
# GitHub emails the repo owner when a run fails. It is not an uptime alarm: see
# docs/WEBSITE-OPERATIONS.md for the 3-minute uptime monitor.
# Note: GitHub pauses scheduled runs after 60 days with no commits; it emails before it does.
name: Live site check
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # A push to GitHub does not deploy by itself (npm run deploy does). This fails when the live
      # pages differ from a fresh build of the latest commit: "pushed but never deployed".
      - name: Live pages match the latest commit
        run: |
          python site-src/build.py
          python - <<'EOF'
          import re, sys, time, urllib.request
          paths = re.findall(r'<loc>https://dzikirassalam.com(/[^<]*)</loc>', open('site/sitemap.xml').read())

          def fetch(url):
              # 3 tries, 20 s each: one network blip is not an outage; a real outage still fails.
              for attempt in range(3):
                  try:
                      return urllib.request.urlopen(url, timeout=20).read()
                  except Exception as e:
                      print(f'attempt {attempt + 1} for {url}: {e}')
                      time.sleep(15)
              raise SystemExit(f'{url} did not answer after 3 attempts')

          stale = []
          for p in paths:
              live = fetch('https://dzikirassalam.com' + p)
              built = open('site' + p + 'index.html', 'rb').read()
              if live != built:
                  stale.append(p)
          print('checked', len(paths), 'pages; differ:', stale or 'none')
          sys.exit(1 if stale else 0)
          EOF
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=mobile
        env: { BASE_URL: 'https://dzikirassalam.com' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: live-check-report, path: playwright-report, retention-days: 14 }
