# Daily Lighthouse scores of the LIVE site, kept as a small history on the lighthouse-data
# branch (lighthouse/history.json). The AHADER owner dashboard reads that file. This job never
# touches main and never deploys anything.
name: Lighthouse
on:
  schedule:
    - cron: '41 1 * * *' # 09:41 MYT
  workflow_dispatch:
permissions:
  contents: write
concurrency: lighthouse
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check out the data branch (created on first run)
        run: |
          if git ls-remote --exit-code --heads origin lighthouse-data >/dev/null; then
            git fetch origin lighthouse-data
            git worktree add data origin/lighthouse-data
          else
            git worktree add --detach data
            git -C data checkout --orphan lighthouse-data
            git -C data rm -rf --quiet . || true
          fi
      - run: node scripts/lighthouse-record.mjs data/lighthouse/history.json
      - name: Save results
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lighthouse/history.json
          git commit -m "Lighthouse $(date -u +%Y-%m-%d)"
          git push origin HEAD:lighthouse-data
