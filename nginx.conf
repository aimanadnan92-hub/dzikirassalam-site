server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Assets: fonts and images rarely change; CSS and JS revalidate daily.
  location /assets/fonts/ { add_header Cache-Control "public, max-age=604800"; }
  location /assets/img/ { add_header Cache-Control "public, max-age=604800"; }
  location /assets/css/ { add_header Cache-Control "public, max-age=86400, must-revalidate"; }
  location /assets/js/ { add_header Cache-Control "public, max-age=86400, must-revalidate"; }
  # config.js holds the TikTok LIVE switch: browsers must re-check it on every page load.
  location = /assets/js/config.js { add_header Cache-Control "no-cache"; }

  # Pages always revalidate, so a new deploy shows immediately. /rawatan/ serves rawatan/index.html.
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ =404; }
  error_page 404 /index.html;
}
