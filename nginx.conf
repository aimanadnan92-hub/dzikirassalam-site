# dzikirassalam.com, static site behind Coolify's Traefik (Traefik terminates HTTPS and
# redirects http to https; this server only ever sees plain http from Traefik).

# Cache policy per path, set once here. Headers are only added at server level on purpose:
# an add_header inside a location would silently drop every security header below.
map $uri $cache_control {
  default                  "no-cache";                              # pages: revalidate, new deploys show at once
  /assets/js/config.js     "no-cache";                              # TikTok LIVE switch: re-checked every load
  ~^/assets/fonts/         "public, max-age=31536000, immutable";   # a changed font gets a new filename
  ~^/assets/(css|js)/      "public, max-age=31536000, immutable";   # pages link them with ?v=<content hash>
  ~^/assets/img/           "public, max-age=2592000";               # 30 days; a changed image gets a new filename
  /favicon.ico             "public, max-age=2592000";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  # Redirects stay relative (/rawatan -> /rawatan/), so they never point visitors at http://.
  absolute_redirect off;
  charset utf-8;
  charset_types text/css application/javascript text/plain application/xml image/svg+xml;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json text/plain application/xml;

  add_header Cache-Control $cache_control always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # The full script/style policy is a <meta> tag in each page (build.py keeps its hashes in step with
  # the inline scripts). These parts only work as a header.
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  # One address for the site: www goes to the bare domain.
  if ($host = "www.dzikirassalam.com") {
    return 301 https://dzikirassalam.com$request_uri;
  }

  # Health check for Coolify and uptime monitors: proves nginx is up and serving.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Never serve dotfiles (.git, .gitignore, tool output).
  location ~ /\. { return 404; }

  # /rawatan/ serves rawatan/index.html; anything else that does not exist is a real 404.
  location / { try_files $uri $uri/ =404; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
